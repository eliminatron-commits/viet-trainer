# Deploy auf GitHub Pages: jeder Push auf main baut dist/ (base /viet-trainer/) und veröffentlicht es.
# Vorher müssen Typecheck und Vitest grün sein. Das Push-Token kommt aus dem Repo-Secret VITE_PUSH_TOKEN
# (nie in eine Datei im Repo); die Worker-URL ist öffentlich.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Logik-Tests rechnen mit Berliner Ortszeit (Tageswechsel, Erinnerungen, Tag/Nacht).
      TZ: Europe/Berlin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
        env:
          VITE_PUSH_URL: https://viet-trainer-push.alex-rettig.workers.dev
          VITE_PUSH_TOKEN: ${{ secrets.VITE_PUSH_TOKEN }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
