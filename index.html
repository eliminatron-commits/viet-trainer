    <script>
      // Vor dem ersten Bild: Nacht von 20:00 bis 8:59 Uhr (wie logic/theme.ts), damit nachts nichts hell aufblitzt.
      // Ein fest gewählter Modus aus den Einstellungen greift nach dem Laden des Spielstands.
      (function () {
        var h = new Date().getHours();
        if (h >= 20 || h < 9) {
          document.documentElement.dataset.theme = 'dark';
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#131A2E');
        }
      })();
    </script>
